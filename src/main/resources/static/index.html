<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Website</title>
        <link rel="stylesheet" href="./bootstrap.css" />
        <link rel="stylesheet" href="./game.css" />
        <!--<link rel="icon" href="./favicon.ico" type="image/x-icon">-->


        <script type="text/javascript" src="./js/model/game.js"></script>
        <script type="text/javascript" src="./js/model/player.js"></script>
        <script type="text/javascript" src="./js/model/question.js"></script>
        <script type="text/javascript" src="./js/model/team.js"></script>

        <script type="text/javascript" src="./js/renderer/render-utils.js"></script>
        <script type="text/javascript" src="./js/renderer/teams-renderer.js"></script>
        <script type="text/javascript" src="./js/renderer/question-renderer.js"></script>
        <script type="text/javascript" src="./js/setup.js"></script>
    </head>
    <body onload="setupDemo()">
        <nav class="navbar bg-body-secondary">Test</nav>
        <main class="container-fluid d-flex flex-row flex-nowrap gap-2 pt-2">
            <aside
                id="teams-container"
                class="d-flex flex-column flex-shrink-0 gap-2"
            >
                <article team="template" class="card">
                    <div class="card-header d-flex flex-row gap-2 justify-content-between">
                      <span class="badge p-2 rounded-pill bg-team-color" part="team-name">Blau</span>
                      <span part="team-points">500</span>
                    </div>
                    <ul
                        part="player-list"
                        class="card-body list-group list-group-flush p-0 d-flex flex-column"
                    >
                        <li
                            player="template"
                            class="list-group-item d-inline-flex flex-row gap-2"
                        >
                            <span part="emoji-container">🐱</span>
                            <span part="player-name" class="flex-grow-1">Thomas</span>
                            <span part="player-points">500</span>
                        </li>
                    </ul>
                    <div class="card-body">
                        <div class="btn-group" role="group">
                            <button type="button" part="answer-btn" class="btn btn-outline-secondary">Answer</button>
                            <button type="button" part="add-controller-btn" class="btn btn-outline-secondary">Add controller</button>
                            <button type="button" part="remove-controller-btn" class="btn btn-outline-secondary">Remove controller</button>
                        </div>
                    </div>
                    <div class="card-footer text-body-secondary">
                        2 days ago
                    </div>
                </article>
            </aside>
            <div class="col">
                <article class="card" id="text-multiple-choice">
                    <div class="card-header">
                        <span part="section">Section</span>
                        <span part="points">100</span>
                    </div>
                    <section class="card-body">
                        <h3 part="question-text" class="card-title mb-4">Question?</h3>
                        <div part="answer-choices" class="answers-grid gap-2">
                            <div choice="template" class="answer align-items-baseline gap-2">
                                <button part="choice-id" type="button" class="btn btn-primary btn-lg">A</button>
                                <span part="choice-text">Test</span>
                            </div>
                        </div>
                    </section>
                </article>
            </div>
        </main>
    </body>
</html>
